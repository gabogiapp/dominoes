<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA fallback: redirects non-hash URLs to hash route
      var segmentCount = 1; // repository name in path e.g. /dominoes/
      var loc = window.location;
      var pathParts = loc.pathname.split('/').filter(Boolean);
      var repo = pathParts[0] || '';
      var route = pathParts.slice(segmentCount).join('/');
      var target = loc.protocol + '//' + loc.host + (repo ? '/' + repo : '') + '/#/' + route + loc.search + loc.hash;
      loc.replace(target);
    </script>
  </head>
  <body>
    <p>Redirecting to Dominoes Tournament...</p>
  </body>
</html>
